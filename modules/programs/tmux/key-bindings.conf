################################################################################
# Key bindings.
################################################################################
# Use vi or emacs-style key bindings in the status line, for example at the
# command prompt.
set-option -g status-key vi

# Use vi or emacs-style key bindings in copy mode.
set-option -g mode-keys vi

# Use a custom prefix.
unbind-key C-b
set -g prefix C-Space

# Reload config.
bind-key R run-shell 'tmux source-file "$([ -f "$TMUX_HOME/tmux.conf" ] && echo "$TMUX_HOME/tmux.conf" || echo "$HOME/.tmux.conf")" > /dev/null'

# Vertical split.
unbind-key %
bind-key v split-window -h -p 50 -c "#{pane_current_path}"

# Horizontal split.
unbind-key '"'
bind-key s split-window -p 50 -c "#{pane_current_path}"

# Select pane.
unbind-key Left
unbind-key Right
unbind-key Up
unbind-key Down
bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# Resizing pane.
unbind-key ^Left
unbind-key ^Right
unbind-key ^Up
unbind-key ^Down
bind-key -r H resize-pane -L
bind-key -r J resize-pane -D
bind-key -r K resize-pane -U
bind-key -r L resize-pane -R

# Buffer.
unbind-key ]
bind-key p paste-buffer

unbind-key [
bind-key y copy-mode

# Copy Mode: vi.
unbind-key -T copy-mode-vi v
unbind-key -T copy-mode-vi Space
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi v send-keys -X begin-selection \; \
  send-keys -X rectangle-off
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi ^v send-keys -X begin-selection \; \
  send-keys -X rectangle-on
bind-key -T copy-mode-vi V send-keys -X select-line \; \
  send-keys -X rectangle-off
bind-key -T copy-mode-vi Escape if-shell '[ #{selection_present} == 1 ]' \
  'send-keys -X clear-selection' \
  'send-keys -X cancel'

# Custom tables.
unbind-key f
bind-key -T custom-table-find Escape
bind-key f switch-client -T custom-table-find
