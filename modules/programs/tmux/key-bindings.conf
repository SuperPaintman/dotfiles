################################################################################
# Key bindings.
################################################################################
# Use vi or emacs-style key bindings in the status line, for example at the
# command prompt.
set-option -g status-key vi

# Use vi or emacs-style key bindings in copy mode.
set-option -g mode-keys vi

# Use a custom prefix.
unbind-key C-b
set -g prefix C-Space

# Reload config.
bind-key R run-shell 'tmux source-file "$([ -f "$TMUX_HOME/tmux.conf" ] && echo "$TMUX_HOME/tmux.conf" || echo "$HOME/.tmux.conf")" > /dev/null'

# Vertical split.
unbind-key %
bind-key v split-window -h -p 50 -c "#{pane_current_path}"

# Horizontal split.
unbind-key '"'
bind-key s split-window -p 50 -c "#{pane_current_path}"

# Select pane.
unbind-key Left
unbind-key Right
unbind-key Up
unbind-key Down
bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# Vim / Neovim integration.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind-key -n 'C-h' \
  if-shell "$is_vim" 
  'send-keys C-h' \
  "if -F '#{pane_at_left}' '' 'select-pane -L'"

bind-key -n 'C-j' \
  if-shell "$is_vim" \
  'send-keys C-j' \
  "if -F '#{pane_at_bottom}' '' 'select-pane -D'"

bind-key -n 'C-k' \
  if-shell "$is_vim" \
  'send-keys C-k' \
  "if -F '#{pane_at_top}' '' 'select-pane -U'"

bind-key -n 'C-l' \
  if-shell "$is_vim" \
  'send-keys C-l' \
  "if -F '#{pane_at_right}' '' 'select-pane -R'"

# Resizing pane.
unbind-key ^Left
unbind-key ^Right
unbind-key ^Up
unbind-key ^Down
bind-key -r H resize-pane -L
bind-key -r J resize-pane -D
bind-key -r K resize-pane -U
bind-key -r L resize-pane -R

# Buffer.
unbind-key ]
bind-key p paste-buffer

unbind-key [
bind-key y copy-mode

# Copy Mode: vi.
unbind-key -T copy-mode-vi v
unbind-key -T copy-mode-vi Space
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi v send-keys -X begin-selection \; \
  send-keys -X rectangle-off
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi ^v send-keys -X begin-selection \; \
  send-keys -X rectangle-on
bind-key -T copy-mode-vi V send-keys -X select-line \; \
  send-keys -X rectangle-off
bind-key -T copy-mode-vi Escape if-shell '[ #{selection_present} == 1 ]' \
  'send-keys -X clear-selection' \
  'send-keys -X cancel'

# Vim / Neovim integration.
# See: https://github.com/christoomey/vim-tmux-navigator
bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' "select-pane -L"
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' "select-pane -D"
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' "select-pane -U"
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' "select-pane -R"

# Custom tables.
unbind-key f
bind-key -T custom-table-find Escape
bind-key f switch-client -T custom-table-find
