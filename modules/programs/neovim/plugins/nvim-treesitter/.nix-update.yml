output: generated.nix
packages:
    nvim-treesitter:
        type: github
        extraAttrs:
            plugin: nvim-treesitter/nvim-treesitter
            branch: master
            commit: &commit 42fc28ba918343ebfd5565147a42a26580579482
        args:
            owner: nvim-treesitter
            repo: nvim-treesitter
            rev: *commit
        nativeBuildInputs:
            - jq
            - yj
            - lua51Packages.lua
            - lua51Packages.cjson
