                      -- Imports.
                      local json = require("cjson")

                      -- Helpers.
                      local function key_to_package_name(key)
                        return "tree-sitter-" .. key
                      end

                      local function read_file(filename)
                        local f = io.open(filename, "rb")
                        if not f then
                          return nil
                        end

                        local content = f:read("*all")

                        f:close()

                        return content
                      end

                      local function to_set(array)
                        if array == nil then
                          return nil
                        end

                        local res = {}
                        for _, value in ipairs(array) do
                          res[value] = true
                        end
                        return res
                      end

                      -- Create polyfills / mocks for vim.
                      local vim = {}
                      vim.fn = {}
                      vim.fn.has = function(s) return false end
                      vim.api = {}
                      vim.treesitter = {
                        language = {
                          register = function(lang, ft) end,
                        },
                      }

                      _G.vim = vim

                      -- Init.
                      whitelist = to_set(whitelist)
                      skiplist = to_set(skiplist)

                      -- Load the parsers list.
                      package.path = SRC .. "/lua/?.lua;" .. package.path
                      local parsers = require("nvim-treesitter.parsers").list

                      -- Load the lockfile.
                      local lockfile = json.decode(read_file(SRC .. "/lockfile.json"))

                      -- Generate an nix file.
                      local packages = {}
                      local warnings = nil
                      local errors = nil

                      for key, parser in pairs(parsers) do
                        local info = parser["install_info"]

                        local skip = false
                        if skiplist ~= nil and skiplist[key] then
                          skip = true
                        end

                        if info == nil then
                          warnings = warnings or {}
                          table.insert(warnings, "Parser " .. key .. " does not have info")
                          skip = true
                        end

                        if not skip and info ~= nil and info["url"] == nil then
                          errors = errors or {}
                          table.insert(errors, "Parser " .. key .. " does not have info.url")
                        end

                        -- if not skip and info ~= nil and info["revision"] == nil then
                        --   errors = errors or {}
                        --   table.insert(errors, "Parser " .. key .. " does not have info.revision")
                        -- end

                        if not skip and (whitelist == nil or whitelist[key]) and not parser["experimental"] then
                          packages[key_to_package_name(key)] = {
                            type = "git",
                            args = {
                              url = info["url"],
                              -- rev = info["revision"],
                            },
                            extraAttrs = {
                              language = key,
                              location = info["location"],
                              generate = info["generate_requires_npm"] or info["generate_requires_npm"],
                            },
                          }
                        end
                      end

                      for key, info in pairs(lockfile) do
                        local parser = packages[key_to_package_name(key)]
                        if parser ~= nil then
                          -- parser["version"] = "0.0.0+rev=" .. string.sub(info["revision"], 1, 6)
                          parser["args"]["rev"] = info["revision"]
                        end
                      end

                      -- TODO(SuperPaitnman):
                      --     These are broken parsers.
                      --     Check why nix-prefetch cannot get them.
                      local broken_parsers = {
                        "dart",
                        "hlsl",
                      }
                      for _, name in ipairs(broken_parsers) do
                        packages[key_to_package_name(name)] = nil
                      end

                      print(json.encode({
                        output = "parsers/generated.nix",
                        packages = packages,
                        warnings = warnings,
                        errors = errors,
                      }))
                      EOF
            - type: update
              args:
                  filename: parsers.yml
